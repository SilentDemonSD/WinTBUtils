name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: .\build.cmd
        shell: cmd
      - name: Package
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory
          Copy-Item tbutil.cmd, LICENSE, cli, bin dist -Recurse
          $env:GITHUB_REF_NAME.TrimStart('v') | Set-Content dist\VERSION
          Compress-Archive dist\* WinTBUtils.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WinTBUtils
          path: WinTBUtils.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME WinTBUtils.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
